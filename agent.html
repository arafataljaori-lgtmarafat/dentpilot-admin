<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DentPilot Agent Portal — بوابة الوكيل</title>
  <meta name="description" content="بوابة الوكلاء لإنشاء أكواد تفعيل DentPilot" />
  <meta name="theme-color" content="#0B3B6F" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* تخطيط مبسّط خاص بالبوابة (يعيد استخدام نظام التصميم الحالي) */
    .portal-top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;}
    .portal-top img{width:30px;height:30px;border-radius:8px;}
    .portal-top .t b{font-size:1rem;font-weight:800;display:block;line-height:1.2;}
    .portal-top .t span{font-size:.72rem;color:var(--muted);}
    .portal-top .spacer{flex:1;}
    .portal-wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px;}
    @media(max-width:400px){.portal-wrap{padding:14px 12px 36px;}}
  </style>
</head>
<body>
  <div id="portal" class="app-loading">
    <div class="boot">
      <div class="boot-mark"><img src="/icons/icon-192.png" alt="" width="56" height="56" /></div>
      <div class="boot-spin" aria-hidden="true"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/api.js"></script>
  <script src="/agent-portal.js"></script>
</body>
</html>
