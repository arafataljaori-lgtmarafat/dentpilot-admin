<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>DentPilot Student — مولّد أكواد التفعيل</title>
<style>
:root{--navy:#0B3B6F;--teal:#16A8A6;--line:#dce7ec;--ink:#12233a;--muted:#5d7389;}
*{box-sizing:border-box;} body{margin:0;font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(150deg,#0B3B6F,#0E5AA0 55%,#16A8A6);min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--ink);}
.card{background:#fff;width:100%;max-width:520px;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.35);overflow:hidden;}
.head{background:linear-gradient(120deg,#0B3B6F,#0E5AA0);color:#fff;padding:20px 24px;}
.head h1{margin:0;font-size:1.2rem;} .head p{margin:4px 0 0;opacity:.85;font-size:.85rem;}
.body{padding:22px 24px;} label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px;color:var(--navy);}
input{width:100%;font-family:inherit;font-size:1rem;padding:12px 13px;border:1px solid var(--line);border-radius:12px;outline:none;letter-spacing:1px;}
input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(22,168,166,.15);}
button{width:100%;margin-top:16px;font-family:inherit;font-weight:700;font-size:1rem;padding:13px;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(120deg,#16A8A6,#0E7A7C);color:#fff;}
button:disabled{opacity:.6;cursor:default;}
.out{margin-top:20px;} .code{font-family:'Courier New',monospace;font-size:1.5rem;font-weight:700;letter-spacing:2px;color:var(--navy);background:#eef7f6;border:1px dashed var(--teal);border-radius:12px;padding:16px;text-align:center;user-select:all;word-break:break-all;}
.muted{color:var(--muted);font-size:.82rem;margin-top:10px;line-height:1.7;} .copyBtn{background:#0B3B6F;margin-top:10px;} .hidden{display:none;}
.err{margin-top:14px;background:#fdecea;border:1px solid #f5c6cb;color:#a3252c;padding:11px 13px;border-radius:12px;font-size:.9rem;line-height:1.6;}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;}
@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<div class="card">
<div class="head"><h1>🎓 مولّد أكواد DentPilot Student</h1><p>أدخل معرّف جهاز الطالب لتوليد كود التفعيل الخاص به.</p></div>
<div class="body">
<label for="dev">معرّف الجهاز (Device ID)</label>
<input id="dev" placeholder="DS-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false"/>
<button id="gen">توليد كود التفعيل</button>
<div id="err" class="err hidden"></div>
<div id="out" class="out hidden"><label>كود التفعيل (أرسله للطالب)</label><div id="code" class="code"></div>
<button id="copy" class="copyBtn">نسخ الكود</button>
<p class="muted">هذا الكود يعمل فقط على الجهاز صاحب المعرّف أعلاه، وحصراً على DentPilot Student. يُحفظ الكود في نظام الإدارة تلقائياً.</p></div>
</div></div>
<script>
(function(){'use strict';
  // صفحة عامة — بلا مفتاح ولا توكن. التوليد كله على الخادم بنفس الخوارزمية ونفس جدول الأكواد.
  var dev=document.getElementById('dev'), out=document.getElementById('out'), code=document.getElementById('code'),
      g=document.getElementById('gen'), c=document.getElementById('copy'), err=document.getElementById('err');
  function showErr(m){ err.textContent = m; err.classList.remove('hidden'); out.classList.add('hidden'); }
  function clearErr(){ err.classList.add('hidden'); }

  async function run(){
    var id = dev.value.trim();
    if (!id) { dev.focus(); return; }
    clearErr(); out.classList.add('hidden');
    var old = g.textContent; g.disabled = true; g.innerHTML = '<span class="spin"></span>';
    try {
      var r = await fetch('/api/agent-generate', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ device_id:id, app:'student' })
      });
      var j = await r.json();
      if (!r.ok) { showErr(j && j.error ? j.error : 'تعذّر توليد الكود.'); return; }
      code.textContent = j.code; out.classList.remove('hidden');
    } catch(e){ showErr('تعذّر الاتصال بالخادم. تحقّق من الإنترنت وحاول مجدداً.'); }
    finally { g.disabled = false; g.textContent = old; }
  }
  g.addEventListener('click', run);
  dev.addEventListener('keydown', function(e){ if(e.key==='Enter') run(); });
  c.addEventListener('click', function(){
    try { navigator.clipboard && navigator.clipboard.writeText(code.textContent); } catch(e){}
    var o=c.textContent; c.textContent='✓ تم النسخ'; setTimeout(function(){ c.textContent=o; },1500);
  });
})();
</script></body></html>
