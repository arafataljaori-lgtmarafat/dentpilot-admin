<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DentPilot Admin — لوحة التحكم</title>
  <meta name="description" content="لوحة تحكم إدارية لإدارة تفعيل وبيع تطبيقات DentPilot" />
  <meta name="application-name" content="DentPilot Admin" />
  <meta name="apple-mobile-web-app-title" content="DP Admin" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0B3B6F" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="./favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app-loading">
    <div class="boot">
      <div class="boot-mark"><img src="./icons/icon-192.png" alt="" width="56" height="56" /></div>
      <div class="boot-spin" aria-hidden="true"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script src="./demo/demo-license.js"></script>
  <script src="./demo/demo-api.js"></script>
  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js', { scope: './' }).catch(function () {});
      });
    }
  </script>
</body>
</html>
